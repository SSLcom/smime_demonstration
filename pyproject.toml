[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smime-demo"
version = "0.1.0"
description = "Reference integration for ordering mailbox-validated S/MIME certificates through the SSL.com SWS API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "requests>=2.32",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
smime-demo = "smime_demo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/smime_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs against the SSL.com sandbox; a person must click the validation links"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"src/smime_demo/cli.py" = ["B008"]  # typer.Option defaults are the Typer idiom
